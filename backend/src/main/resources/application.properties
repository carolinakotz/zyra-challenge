spring.application.name=zyra

# conexão com o Oracle da FIAP.
# os valores vêm só das variáveis de ambiente, sem valor padrão:
# se alguma não existir, a aplicação falha ao iniciar.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# chave que assina e confere os tokens JWT (HS256).
# segredo: vem só da variável de ambiente, SEM valor padrão.
# sem ela, ou com menos de 32 caracteres, a aplicação falha ao iniciar.
zyra.jwt.segredo=${JWT_SECRET}

# validade do token em minutos (não é segredo, por isso tem padrão)
zyra.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:60}

# porta do servidor: o Render informa pela variável PORT; localmente usa 8080
server.port=${PORT:8080}
